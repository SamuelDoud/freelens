# yaml-language-server: $schema=https://raw.githubusercontent.com/electron-userland/electron-builder/refs/heads/master/packages/app-builder-lib/scheme.json

electronVersion: 44.11.5 # datasource=npm depName=electron

## node-pty is our only native module and it is a N-API (node-addon-api)
## addon, so its bundled prebuilt binaries are ABI-stable and load as-is on
## every Electron version we ship. No native rebuild is needed at pack time.
npmRebuild: false

## The interface is in English only: Chromium's other locales only translate
## its own few strings, such as those of the spell checker.
electronLanguages:
  - en
  - en-US
  - en_US

## There is no support in app for autoupdates yet
detectUpdateChannel: false
generateUpdatesFilesForAllChannels: true
publish: []

## Files in app.asar
files:
  - static
  ## Workspace packages are bundled from TypeScript source into
  ## static/build by electron-vite and never required at runtime
  - "!node_modules/@freelensapp/**"
  - "!node_modules/electron"
  ## Source maps and TS build info are only useful when debugging local builds
  - "!**/*.map"
  - "!**/*.tsbuildinfo"
  ## Monaco is bundled into the renderer by Vite and never required at runtime
  - "!node_modules/monaco-editor/**"
  ## node-pty ships vendor-provided prebuilt binaries under prebuilds/ that we
  ## load as-is (see npmRebuild above). A local build/ directory would only ever
  ## contain unsigned binaries that some antivirus engines flag as false
  ## positives (see issue #2021), so exclude it: node-pty's loader then falls
  ## back to the vendor prebuilds at runtime (lib/utils.js checks build/Release
  ## first, then prebuilds/<platform>-<arch>).
  - "!node_modules/node-pty/build"
  ## Native binaries for other platforms/arches are never loaded at runtime, so
  ## exclude them at pack time. Doing this here (instead of deleting them from
  ## app.asar.unpacked afterwards) keeps the app.asar header consistent with the
  ## files actually present. ${platform} expands to darwin/linux/win32 and ${arch}
  ## to x64/arm64, matching node-pty's prebuild directory names (e.g. darwin-arm64).
  ## ${platform} is the platform of the build host (process.platform), not the
  ## target, so each platform has to be packed on its own OS.
  - "!node_modules/node-pty/prebuilds/!(${platform}-${arch})"
  - "!node_modules/node-pty/prebuilds/!(${platform}-${arch})/**"
  ## On Windows, conpty.node loads the bundled ConPTY (conpty.dll, which starts
  ## OpenConsole.exe) from conpty/ next to itself, which the globs above keep as
  ## prebuilds/win32-<arch>/conpty/. third_party/ holds the same files for every
  ## Windows arch, only for node-pty's install script to copy into a local
  ## build/, so it is never loaded at runtime.
  - "!node_modules/node-pty/third_party"
  ## Files that are not loaded at runtime: TypeScript sources and declarations,
  ## Flow types and documentation. Licenses stay.
  - "!**/node_modules/**/*.{ts,mts,cts,flow}"
  - "!**/node_modules/**/{README,Readme,readme,CHANGELOG,Changelog,changelog,HISTORY,History,CONTRIBUTING,SECURITY,UPGRADING}*"
  - "!**/node_modules/**/{docs,doc,example,examples,test,tests,__tests__,benchmark,benchmarks}/**"
  ## Packages that only the bundled renderer, or a dependency bundled into the
  ## main process, uses: the main process never loads them at runtime. The
  ## renderer and extensions get their libraries from the bundles, not from
  ## node_modules. build/check-packaged-dependencies.cjs fails the build when
  ## the main process needs one of them, and `--report` lists the packaged
  ## dependencies the main process does not need, to add here.
  - "!**/node_modules/@babel/code-frame/**"
  - "!**/node_modules/@babel/generator/**"
  - "!**/node_modules/@babel/helper-globals/**"
  - "!**/node_modules/@babel/helper-module-imports/**"
  - "!**/node_modules/@babel/helper-string-parser/**"
  - "!**/node_modules/@babel/helper-validator-identifier/**"
  - "!**/node_modules/@babel/parser/**"
  - "!**/node_modules/@babel/runtime/**"
  - "!**/node_modules/@babel/template/**"
  - "!**/node_modules/@babel/traverse/**"
  - "!**/node_modules/@babel/types/**"
  - "!**/node_modules/@dnd-kit/accessibility/**"
  - "!**/node_modules/@dnd-kit/core/**"
  - "!**/node_modules/@dnd-kit/sortable/**"
  - "!**/node_modules/@dnd-kit/utilities/**"
  - "!**/node_modules/@emotion/babel-plugin/**"

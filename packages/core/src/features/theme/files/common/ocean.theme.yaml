# yaml-language-server: $schema=https://raw.githubusercontent.com/freelensapp/freelens/main/schemas/theme-v1.schema.json
#
# Ocean: a theme of this fork, which earlier versions of the fork offered as a color palette
# over the default theme. It re-hues the surfaces and borders of freelens and replaces its accent,
# keeping the lightness of each surface so that text keeps its contrast. The text on the accent is
# the color that reaches the WCAG AA contrast on every accent background. The terminal and the code
# editor colors are those of freelens.
apiVersion: freelens.app/v1
kind: Theme
metadata:
  name: ocean
spec:
  displayName: Ocean
  description: Blue surfaces with a blue accent.
  author: Freelens fork authors
